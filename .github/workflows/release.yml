# Manual protected release workflow. Configure the release environment and
# protected refs before use. No publishing token or fabricated signature is shipped.
name: release-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v7
        with: {node-version: '22', package-manager-cache: false}
      - run: python -m pip install -e '.[server,otel,platform-test,browser]' build cyclonedx-bom
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix sdks/typescript
      - run: npm run build --prefix sdks/typescript
      - run: npm test --prefix sdks/typescript
      - run: python scripts/verify_release.py
        env: {ORDEAL_UI_ARTIFACTS: artifacts/ui}
      - run: python -m build
      - run: cd sdks/typescript && npm pack --pack-destination ../../dist
      - run: cyclonedx-py environment -o dist/sbom.json
      - uses: actions/attest@v4
        with: {subject-path: 'dist/*'}
      - uses: actions/upload-artifact@v7
        with: {name: release-candidate, path: dist}
