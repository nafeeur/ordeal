# Supplied workflow, not a statement these external scanners ran in this build.
name: security-checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  dependencies-and-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[server,otel,postgres,s3]' pip-audit bandit cyclonedx-bom
      - run: pip-audit --skip-editable --strict
      - run: bandit -r src -ll -ii
      - run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: security-evidence, path: sbom.json}
# Enable repository secret scanning / push protection and independent container
# scanning in your registry. Do not claim they are enabled by this YAML file.
