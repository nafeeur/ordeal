version: 2.1
jobs:
  behavior:
    docker: [{image: cimg/python:3.13}]
    steps:
      - checkout
      - run: python -m pip install '.[server]'
      - run: ordeal-behavior run examples/enterprise/suite.py --json report.json --junit results/report.xml
      - run: ordeal-server gate report.json --summary summary.md
      - store_test_results: {path: results}
      - store_artifacts: {path: report.json}
workflows:
  test:
    jobs: [behavior]
