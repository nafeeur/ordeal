apiVersion: v1
kind: Namespace
metadata: {name: ordeal}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: ordeal-config, namespace: ordeal}
data:
  ORDEAL_ENV: production
  ORDEAL_AUTH_DISABLED: "false"
  ORDEAL_MAX_PARALLEL_TRIALS: "128"
  ORDEAL_JOB_LEASE_SECONDS: "180"
  ORDEAL_QUEUE_BACKEND: kafka
  ORDEAL_KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092"
  ORDEAL_KAFKA_TOPIC_PREFIX: ordeal
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: ordeal}
spec:
  replicas: 3
  selector: {matchLabels: {app: ordeal-api}}
  template:
    metadata: {labels: {app: ordeal-api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/YOUR_ORG/ordeal-api:1.0.0
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: ordeal-config}}, {secretRef: {name: ordeal-secrets}}]
        readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        resources: {requests: {cpu: "500m", memory: "512Mi"}, limits: {cpu: "2", memory: "2Gi"}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: ordeal}
spec:
  selector: {app: ordeal-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cpu-worker, namespace: ordeal}
spec:
  replicas: 8
  selector: {matchLabels: {app: ordeal-cpu-worker}}
  template:
    metadata: {labels: {app: ordeal-cpu-worker}}
    spec:
      containers:
      - name: worker
        image: ghcr.io/YOUR_ORG/ordeal-api:1.0.0
        command: ["python","/app/worker.py","--api","http://api:8000","--capabilities","cpu","--capacity","16","--labels","pool=cpu,transport=kafka"]
        envFrom: [{secretRef: {name: ordeal-secrets}}]
        resources: {requests: {cpu: "2", memory: "2Gi"}, limits: {cpu: "8", memory: "8Gi"}}

---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka-dispatcher, namespace: ordeal}
spec:
  replicas: 2
  selector: {matchLabels: {app: ordeal-kafka-dispatcher}}
  template:
    metadata: {labels: {app: ordeal-kafka-dispatcher}}
    spec:
      containers:
      - name: dispatcher
        image: ghcr.io/YOUR_ORG/ordeal-api:1.0.1
        command: ["python","/app/kafka_dispatcher.py"]
        envFrom: [{configMapRef: {name: ordeal-config}}, {secretRef: {name: ordeal-secrets}}]
        resources: {requests: {cpu: "250m", memory: "256Mi"}, limits: {cpu: "2", memory: "1Gi"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: result-aggregator, namespace: ordeal}
spec:
  replicas: 3
  selector: {matchLabels: {app: ordeal-result-aggregator}}
  template:
    metadata: {labels: {app: ordeal-result-aggregator}}
    spec:
      containers:
      - name: aggregator
        image: ghcr.io/YOUR_ORG/ordeal-api:1.0.1
        command: ["python","/app/kafka_aggregator.py"]
        envFrom: [{configMapRef: {name: ordeal-config}}, {secretRef: {name: ordeal-secrets}}]
        resources: {requests: {cpu: "500m", memory: "512Mi"}, limits: {cpu: "4", memory: "2Gi"}}
