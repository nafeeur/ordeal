[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordeal-agent"
version = "0.3.0"
description = "Standalone, open-source agent behavior testing, tracing, and team operations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ordeal contributors"}]
dependencies = [
  "jsonschema>=4.22",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic>=2.8,<3", "PyJWT[crypto]>=2.9,<3", "cryptography>=50,<52"]
otel = ["opentelemetry-proto>=1.29,<2", "grpcio>=1.65,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
platform-test = ["pytest>=8,<10", "pytest-asyncio>=0.23", "pytest-cov>=5", "opentelemetry-sdk>=1.29,<2", "grpcio>=1.65,<2", "opentelemetry-proto>=1.29,<2"]
browser = ["playwright>=1.48,<2"]
yaml = ["PyYAML>=6.0"]
anthropic = ["anthropic>=0.40"]
openai-agents = ["openai-agents>=0.3"]
langchain = ["langchain-core>=0.3"]
pydantic-ai = ["pydantic-ai>=0.0.30"]
google-adk = ["google-adk>=1"]
crewai = ["crewai>=0.80"]
autogen = ["autogen-agentchat>=0.4"]
llamaindex = ["llama-index-core>=0.12"]
smolagents = ["smolagents>=1"]
strands = ["strands-agents>=1"]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "mypy>=1.11", "build>=1.2"]
all = [
  "PyYAML>=6.0",
  "anthropic>=0.40",
  "openai-agents>=0.3",
  "langchain-core>=0.3",
  "pydantic-ai>=0.0.30",
  "google-adk>=1",
  "crewai>=0.80",
  "autogen-agentchat>=0.4",
  "llama-index-core>=0.12",
  "smolagents>=1",
  "strands-agents>=1",
  "mcp>=2,<3",
]

[project.scripts]
ordeal-behavior = "ordeal_agent.cli:app"
ordeal-server = "ordeal_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordeal_agent = ["py.typed"]
ordeal_platform = ["py.typed", "static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: actual Chromium UI workflows; supports explicit test-only HTTP bridge in restricted environments"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
strict = true
